name: Update README cards

# Génère les cartes de stats en SVG et les commite dans le dépôt.
# Le README les affiche depuis le dépôt lui-même : aucun service tiers à l'affichage.

on:
  schedule:
    - cron: "17 4 * * *" # une fois par jour
  workflow_dispatch:

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # role = dépôts personnels + ceux des organisations + ceux où je suis collaborateur.
      # STATS_PAT (jeton classique, scopes repo + read:user) ouvre les dépôts privés.
      # Sans lui, les cartes ne comptent que l'activité publique.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&include_all_commits=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=github_dark&hide=html&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
